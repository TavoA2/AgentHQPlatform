name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent_hq
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: agent_hq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent_hq" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      AGENT_HQ_ENVIRONMENT: test
      AGENT_HQ_DATABASE_URL: postgresql+psycopg://agent_hq:ci-only@localhost:5432/agent_hq
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t agent-hq-api apps/api
      - run: docker build -t agent-hq-web apps/web
