name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agent_hq
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: agent_hq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent_hq" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      AGENT_HQ_ENVIRONMENT: test
      AGENT_HQ_DATABASE_URL: postgresql+psycopg://agent_hq:ci-only@localhost:5432/agent_hq
      AGENT_HQ_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build sandbox test image
        run: docker build -t agent-hq-sandbox-python:local ../sandbox-images/python
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t agent-hq-api apps/api
      - run: docker build -t agent-hq-web apps/web
      - run: docker build -t agent-hq-sandbox-python apps/sandbox-images/python
      # Report-only for now (ADR-0014): base-image CVEs are tracked, not yet gating.
      - name: Scan images (Trivy)
        run: |
          for image in agent-hq-api agent-hq-web agent-hq-sandbox-python; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.67.2 image --quiet --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 0 "$image"
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the full history
      - name: Secret scanning (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml
      - uses: astral-sh/setup-uv@v6
      - name: Python dependency audit
        working-directory: apps/api
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -q > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: npm dependency audit
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Lint shell scripts
        working-directory: deploy/scripts
        run: shellcheck -x -e SC1091 *.sh
      - name: Validate production compose
        working-directory: .
        run: |
          cp deploy/env.prod.example .env.prod
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' .env.prod
          docker compose --env-file .env.prod -f deploy/compose.prod.yaml config -q
